appId: com.orion.securitytoolkit
productName: Orion
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - "!**/*.map"
extraResources:
  - from: ../core
    to: core
  - from: ../scripts
    to: scripts
  - from: build
    to: build

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: "Orion-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Utility
  syncDesktopName: true
  artifactName: "Orion-${version}.${ext}"
deb:
  synopsis: Local defensive security audit toolkit
  maintainer: noreply@users.noreply.github.com
  artifactName: "orion_${version}_amd64.${ext}"
